<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Travelbee</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&family=Hanken+Grotesk:wght@900&display=swap" rel="stylesheet">
  <style>
    /* Tokens follow the Glaze system (design.how/systems/glaze): ink and paper, greys as ink at alphas,
       glass only on the one button a group leads with, no shadows, pill controls. */
    :root {
      --page: #ffffff;
      --paper: #ffffff;
      --shell: #f1f1f0;
      --text-1: rgb(5 5 5 / .80);
      --text-2: rgb(5 5 5 / .60);
      --text-3: rgb(5 5 5 / .45);
      --text-disabled: rgb(5 5 5 / .32);
      --line-faint: rgb(5 5 5 / .06);
      --line: rgb(5 5 5 / .10);
      --line-control: rgb(5 5 5 / .15);
      --line-focus: rgb(5 5 5 / .32);
      --hover: rgb(5 5 5 / .05);
      --field: #f4f4f3;
      --flat-hover: #f8f8f8;
      --fail: #e35e49;

      --glass-ink-base: rgb(0 0 0 / .66);
      --glass-ink-text: rgb(255 255 255 / .90);
      --glass-ink-ring: rgb(0 0 0 / .56);
      --glass-green-base: rgb(6 86 40 / .88);
      --glass-green-text: rgb(255 255 255 / .90);
      --glass-green-ring: rgb(4 64 28 / .56);
      --glass-sheen: .12;
      --glass-sheen-hover: .16;
      --glass-core: .32;
      --glass-core-held: .44;
      --glass-rim: .24;
      --glass-glaze: .06;
      --glass-gloss: .28;
      --glass-blur: 6px;
      --gloss-inset: .28;
      --gloss-top: 1.5px;
      --gloss-height: 44%;
      --scale-press-glass: .99;
      --ease-out: cubic-bezier(.2, .8, .2, 1);

      --radius-shell: 14px;
      --radius-panel: 11px;
      --radius-pill: 999px;
      --radius-tag: 6px;
      --font-sans: "Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background: var(--page);
      color: var(--text-1);
      font: 400 14px/1.5 var(--font-sans);
    }
    body { overflow-x: clip; }
    body.app-view { place-items: start center; }
    main { width: 100%; max-width: 520px; display: flex; flex-direction: column; align-items: center; gap: 40px; }
    body.app-view main { max-width: 560px; gap: 20px; }
    .stack { width: 100%; display: flex; flex-direction: column; gap: 16px; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    /* ---------- title (halftone, adapted from the ARC landing page) ---------- */
    h1.brand { margin: 0; width: 100%; }
    .home { display: block; cursor: pointer; -webkit-tap-highlight-color: transparent; border-radius: 12px; }
    .halftone { display: block; width: 100%; height: clamp(150px, 44vw, 250px); }
    body.app-view .halftone { height: clamp(84px, 24vw, 120px); }

    /* ---------- glass: the Glaze press recipe, one glass button per group ---------- */
    .glass {
      --gl-base: var(--glass-ink-base);
      --gl-text: var(--glass-ink-text);
      --gl-ring: var(--glass-ink-ring);
      --gl-sheen-now: var(--glass-sheen);
      --gl-core-now: var(--glass-core);
      --gl-rim-a: #ffffff;
      --gl-rim-b: #999999;
      --glass-h: 52px;
      position: relative;
      isolation: isolate;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      height: var(--glass-h);
      padding: 0 28px;
      border: 0;
      border-radius: var(--radius-pill);
      font: 500 17px/1.35 var(--font-sans);
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
      color: var(--gl-text);
      background-color: var(--gl-base);
      background-image:
        radial-gradient(65.62% 65.62% at 50% 50%, rgb(0 0 0 / var(--gl-core-now)), transparent),
        linear-gradient(rgb(255 255 255 / var(--gl-sheen-now)), transparent),
        linear-gradient(rgb(255 255 255 / var(--glass-glaze)) 0%, rgb(255 255 255 / calc(var(--glass-glaze) * .4)) 50%, transparent 50%);
      box-shadow:
        inset 0 -12px 16px 0 rgb(255 255 255 / .06),
        inset 0 4px 16px 0 rgb(255 255 255 / .16),
        inset 0 .75px .25px 0 rgb(255 255 255 / .12),
        inset 0 .25px .25px 0 rgb(255 255 255 / .32),
        0 0 0 .75px var(--gl-ring);
      -webkit-backdrop-filter: blur(var(--glass-blur));
      backdrop-filter: blur(var(--glass-blur));
      transition: scale 200ms var(--ease-out), color 200ms var(--ease-out);
    }
    .glass-green { --gl-base: var(--glass-green-base); --gl-text: var(--glass-green-text); --gl-ring: var(--glass-green-ring); }
    .glass-sm { --glass-h: 40px; padding: 0 22px; font-size: 14px; }
    .glass::before {
      content: "";
      position: absolute; z-index: -1; pointer-events: none;
      inset: 0; padding: 1px; border-radius: inherit;
      background-image: linear-gradient(var(--gl-rim-a) 0%, var(--gl-rim-b) 55%, var(--gl-rim-a) 80%, var(--gl-rim-b) 95%);
      opacity: var(--glass-rim);
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
    }
    .glass::after {
      content: "";
      position: absolute; z-index: -1; pointer-events: none;
      inset-inline: calc(var(--glass-h) * var(--gloss-inset));
      top: var(--gloss-top); height: var(--gloss-height);
      border-radius: var(--radius-pill);
      background-image: linear-gradient(rgb(255 255 255 / var(--glass-gloss)), transparent);
      transition: opacity 200ms var(--ease-out);
    }
    @media (hover: hover) { .glass:hover:not(:disabled) { --gl-sheen-now: var(--glass-sheen-hover); } }
    .glass:active:not(:disabled) { --gl-sheen-now: 0; --gl-core-now: var(--glass-core-held); scale: var(--scale-press-glass); transition-duration: 50ms; }
    .glass:active:not(:disabled)::after { opacity: .6; }
    /* disabled glass drops to a flat grey pill */
    .glass:disabled { background-image: none; background-color: var(--field); box-shadow: 0 0 0 1px var(--line-faint); color: var(--text-disabled); cursor: not-allowed; -webkit-backdrop-filter: none; backdrop-filter: none; }
    .glass:disabled::before, .glass:disabled::after { display: none; }
    .glass svg { width: 22px; height: 22px; flex: none; }
    .glass-sm svg { width: 16px; height: 16px; }

    :where(button, input, select, textarea, a):focus-visible { outline: 2px solid var(--text-1); outline-offset: 2px; }

    /* ---------- AI lights (design.how/vault/ai-lights): one pulse of rim light around a pressed button ---------- */
    @property --ai-deg-start { syntax: "<angle>"; inherits: false; initial-value: 180deg; }
    @property --ai-stop-2 { syntax: "<angle>"; inherits: false; initial-value: 16deg; }
    @property --ai-stop-3 { syntax: "<angle>"; inherits: false; initial-value: 30deg; }
    @property --ai-stop-4 { syntax: "<angle>"; inherits: false; initial-value: 43deg; }
    @property --ai-stop-5 { syntax: "<angle>"; inherits: false; initial-value: 59deg; }
    @property --ai-stop-6 { syntax: "<angle>"; inherits: false; initial-value: 72deg; }
    @property --ai-stop-7 { syntax: "<angle>"; inherits: false; initial-value: 84deg; }
    .ail-layer { position: absolute; z-index: -1; pointer-events: none; mask-repeat: no-repeat; mask-size: 100% 100%; -webkit-mask-repeat: no-repeat; -webkit-mask-size: 100% 100%; }
    .ail-layer::before {
      content: ""; position: absolute; inset: 0; opacity: 0;
      background: conic-gradient(from var(--ai-deg-start) at 50% 50%,
        var(--ai-c1, #005bf6) 0deg, var(--ai-c2, #b0c6e9) var(--ai-stop-2), var(--ai-c3, #feca00) var(--ai-stop-3),
        var(--ai-c4, #ff1c11) var(--ai-stop-4), var(--ai-c5, #ff00ea) var(--ai-stop-5), var(--ai-c6, #ffa2fbcc) var(--ai-stop-6),
        transparent var(--ai-stop-7), transparent 324deg, var(--ai-tail, #95c1ffa1) 349deg, var(--ai-c1, #005bf6) 360deg);
    }
    [data-playing="true"] > .ail-layer::before { will-change: opacity; animation: ail-pulse 1600ms cubic-bezier(.26, .94, .6, 1) both; }
    @keyframes ail-pulse {
      0% { opacity: 0; }
      10%, 30% { opacity: 1; animation-timing-function: linear; }
      88% { opacity: 0; animation-timing-function: linear; }
      100% { opacity: 0; --ai-deg-start: 30deg; --ai-stop-2: 6deg; --ai-stop-3: 11deg; --ai-stop-4: 17deg; --ai-stop-5: 40deg; --ai-stop-6: 90deg; --ai-stop-7: 120deg; }
    }
    @media (prefers-reduced-motion: reduce) { [data-playing="true"] > .ail-layer::before { animation: none; } }

    /* ---------- flat secondary button ---------- */
    .flat {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      height: 40px; padding: 0 18px;
      border: 0; border-radius: var(--radius-pill);
      background: var(--paper); color: var(--text-1);
      box-shadow: 0 0 0 1px var(--line);
      font: 500 14px/1.35 var(--font-sans);
      white-space: nowrap; text-decoration: none; cursor: pointer;
      transition: background-color 120ms var(--ease-out), scale 120ms var(--ease-out);
    }
    .flat:hover { background: var(--flat-hover); }
    .flat:active { scale: .99; }
    .flat:disabled { background: var(--field); color: var(--text-disabled); cursor: not-allowed; }
    .flat svg { width: 16px; height: 16px; }

    /* ---------- ghost icon buttons ---------- */
    .actions { display: flex; gap: 4px; min-height: 40px; margin-top: -16px; }
    .ghost {
      display: grid; place-items: center;
      width: 40px; height: 40px;
      border: 0; border-radius: var(--radius-pill);
      background: transparent; color: var(--text-2);
      cursor: pointer; text-decoration: none;
      transition: background-color 120ms var(--ease-out), color 120ms var(--ease-out), scale 120ms var(--ease-out);
    }
    .ghost:hover { background: var(--hover); color: var(--text-1); }
    .ghost:active { scale: .97; }
    .ghost svg { width: 20px; height: 20px; }
    .error-line { margin: -16px 0 0; font-size: 13px; color: var(--fail); text-align: center; }

    /* ---------- shell card, panel, footer ---------- */
    .shell { width: 100%; background: var(--shell); border-radius: var(--radius-shell); padding: 3px; }
    .panel { background: var(--paper); border-radius: var(--radius-panel); box-shadow: 0 0 0 1px var(--line-faint); padding: 20px; }
    .panel.tight-bottom { padding-bottom: 8px; }
    .shell-foot { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 6px; padding-inline-start: 14px; }
    .shell-foot:has(.glass) { background: var(--paper); border-radius: 0 0 var(--radius-panel) var(--radius-panel); box-shadow: 0 0 0 1px var(--line-faint); padding: 14px 16px 16px 20px; }
    .panel:has(+ .shell-foot .glass) { border-bottom-left-radius: 0; border-bottom-right-radius: 0; box-shadow: none; }
    .shell:has(.shell-foot .glass) { box-shadow: 0 0 0 1px var(--line-faint); }
    .shell-foot .meta { margin-inline-end: auto; font: 400 12px/1.35 var(--font-sans); color: var(--text-2); }
    h2.title { margin: 0 0 4px; font: 500 28px/1.2 var(--font-sans); letter-spacing: -.01em; }
    h2.heading { margin: 0 0 12px; font: 500 20px/1.3 var(--font-sans); }
    p.desc { margin: 0 0 20px; color: var(--text-2); }
    p.note { margin: 0; color: var(--text-2); font-size: 13px; }

    .field { margin: 0 0 20px; padding: 0; border: 0; min-width: 0; }
    .field > label, .field > legend { display: block; padding: 0; margin-bottom: 8px; font: 500 13px/1.35 var(--font-sans); color: var(--text-1); }
    .field .hint { display: block; margin-top: 6px; font-size: 12px; color: var(--text-2); }
    .field .error { display: block; margin-top: 6px; font-size: 12px; color: var(--fail); }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 420px) { .row2 { grid-template-columns: 1fr; } }
    .input {
      width: 100%; height: 36px; padding: 0 14px;
      border: 0; border-radius: var(--radius-pill);
      background: var(--paper); color: var(--text-1);
      font: 400 14px/1.35 var(--font-sans);
      box-shadow: 0 0 0 1px var(--line-control);
      transition: box-shadow 120ms var(--ease-out);
    }
    .input::placeholder { color: var(--text-3); }
    .input:hover, .input:focus { box-shadow: 0 0 0 1px var(--line-focus); }
    .input[aria-invalid="true"] { box-shadow: 0 0 0 1px var(--fail); }
    .input.area { height: auto; padding: 8px 14px; border-radius: 10px; resize: vertical; min-height: 64px; }
    select.input { appearance: none; padding-right: 32px; background-image: linear-gradient(45deg, transparent 50%, var(--text-2) 50%), linear-gradient(135deg, var(--text-2) 50%, transparent 50%); background-position: calc(100% - 18px) 15px, calc(100% - 13px) 15px; background-size: 5px 5px; background-repeat: no-repeat; }

    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { position: relative; }
    .chip input { position: absolute; opacity: 0; inset: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
    .chip span {
      display: inline-flex; align-items: center; height: 32px; padding: 0 14px;
      border-radius: var(--radius-pill);
      font: 500 13px/1.35 var(--font-sans); color: var(--text-1);
      box-shadow: 0 0 0 1px var(--line-control); background: var(--paper);
      transition: background-color 120ms var(--ease-out), box-shadow 120ms var(--ease-out);
    }
    .chip:hover span { background: var(--hover); }
    .chip input:checked + span { box-shadow: 0 0 0 1.5px var(--text-1); background: var(--hover); }
    .chip input:focus-visible + span { outline: 2px solid var(--text-1); outline-offset: 2px; }

    .link-row { display: flex; align-items: center; gap: 4px; }
    .link-row .input { flex: 1; min-width: 0; }

    /* ---------- travelers list ---------- */
    .rows { list-style: none; margin: 0; padding: 0; }
    .rows li { display: flex; align-items: baseline; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line-faint); }
    .rows li:first-child { border-top: 0; padding-top: 0; }
    .rows .who { font-weight: 500; }
    .rows li { flex-wrap: wrap; }
    .rows .sub { color: var(--text-2); font-size: 13px; margin-inline-start: auto; text-align: right; }
    .rows .detail { flex-basis: 100%; margin: -4px 0 0; color: var(--text-2); font-size: 13px; }
    .badge { display: inline-block; padding: 0 8px; height: 20px; line-height: 20px; border-radius: var(--radius-pill); font: 500 12px/20px var(--font-sans); color: var(--text-2); box-shadow: 0 0 0 1px var(--line); margin-inline-start: 8px; }
    .empty { color: var(--text-2); margin: 0; }

    /* ---------- plan, log ---------- */
    .plan-list { list-style: none; margin: 0 0 16px; padding: 0; }
    .plan-list li { display: flex; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line-faint); }
    .plan-list li:first-child { border-top: 0; }
    .plan-list .kind { width: 72px; flex: none; color: var(--text-2); font-size: 13px; }
    .plan-list .what { flex: 1; min-width: 0; }
    .plan-list .price { color: var(--text-2); font-size: 13px; white-space: nowrap; }
    .log { max-height: 340px; overflow: auto; margin: 0 -4px; padding: 0 4px; }
    .msg { padding: 8px 0; border-top: 1px solid var(--line-faint); }
    .msg:first-child { border-top: 0; }
    .msg .meta { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-2); }
    .msg .tag { padding: 0 8px; height: 18px; line-height: 18px; border-radius: var(--radius-pill); box-shadow: 0 0 0 1px var(--line); font-size: 11px; }
    .msg .tag.objection { color: var(--fail); box-shadow: 0 0 0 1px var(--fail); }
    .msg .text { margin-top: 2px; }
    .choice-list { display: flex; flex-direction: column; gap: 8px; align-items: stretch; margin-bottom: 4px; }
    .choice-list .flat { justify-content: flex-start; height: 44px; padding: 0 18px; }
    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .waiting { display: flex; align-items: center; gap: 10px; color: var(--text-2); }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-2); animation: pulse 1.2s ease-in-out infinite; flex: none; }
    @keyframes pulse { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }

    .steps { list-style: none; margin: 4px 0 16px; padding: 0; }
    .steps li { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
    .steps .check { position: relative; width: 18px; height: 18px; flex: none; border-radius: 50%; box-shadow: 0 0 0 1.5px var(--line-focus); }
    .steps .done { color: var(--text-2); }
    .steps .done .check { background: var(--text-1); box-shadow: none; }
    .steps .done .check::after { content: ""; position: absolute; left: 6px; top: 3px; width: 4px; height: 8px; border: solid #fff; border-width: 0 1.5px 1.5px 0; transform: rotate(45deg); }
    .steps a { color: var(--text-1); text-underline-offset: 3px; }
    .trip-link { display: flex; align-items: baseline; gap: 12px; width: 100%; color: inherit; text-decoration: none; }
    .trip-link:hover .who { text-decoration: underline; text-underline-offset: 3px; }
    #trips { max-width: 520px; }
    a { color: inherit; }
    .link-strong { font: 500 13px/1.35 var(--font-sans); color: var(--text-1); text-decoration: underline; text-underline-offset: 3px; }
    .link-strong:hover { color: var(--text-2); }
    .textlink { background: none; border: 0; padding: 0; margin: 0; font: inherit; font-size: 13px; color: var(--text-2); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
    .textlink:hover { color: var(--text-1); }
    .shell-foot .textlink { font-size: 12px; }
    .rows li > details { width: 100%; }
    .member summary { display: flex; align-items: baseline; gap: 12px; cursor: pointer; list-style: none; }
    .member summary::-webkit-details-marker { display: none; }
    .member .detail { margin: 6px 0 0; }

    @media (prefers-reduced-motion: reduce) {
      .glass, .ghost, .flat, .input, .chip span { transition: none; }
      .glass:active, .ghost:active, .flat:active { scale: 1; }
      .dot { animation: none; }
    }
    @media (forced-colors: active) {
      .glass { background-image: none; box-shadow: none; border: 1px solid ButtonText; }
      .glass::before, .glass::after { display: none; }
    }
  </style>
</head>
<body>
  <main>
    <h1 class="brand"><a class="home" href="/" aria-label="Travelbee, back to the start"><canvas id="title" class="halftone" aria-hidden="true"></canvas></a></h1>

    <!-- Landing: create a trip and get the join link -->
    <section id="view-create" style="display:contents">
      <button id="generate" class="glass glass-green" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M10 13a5 5 0 0 0 7.07 0l2.83-2.83a5 5 0 0 0-7.07-7.07L11.5 4.43"/>
          <path d="M14 11a5 5 0 0 0-7.07 0L4.1 13.83a5 5 0 0 0 7.07 7.07l1.33-1.33"/>
        </svg>
        <span>Generate a travel link</span>
      </button>
      <p id="create-error" class="error-line" role="alert" hidden></p>
      <section id="trips" class="stack" hidden aria-label="Your trips"></section>
    </section>

    <!-- Every other screen is drawn into this container -->
    <section id="app" class="stack" hidden></section>
    <div id="status" class="sr-only" role="status" aria-live="polite"></div>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const params = new URLSearchParams(location.search);
    const TRIP = params.get("trip"), ADMIN = params.get("admin"), UID = params.get("u"), ANSWER_MODE = params.get("answer"), NEW = params.get("new");

    /* ---------------- small helpers ---------------- */
    function h(tag, props, ...kids) {
      const el = document.createElement(tag);
      for (const [k, v] of Object.entries(props || {})) {
        if (v === false || v == null) continue;
        if (k === "class") el.className = v;
        else if (k === "text") el.textContent = v;
        else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
        else el.setAttribute(k, v === true ? "" : v);
      }
      for (const c of kids.flat()) { if (c == null || c === false) continue; el.append(c.nodeType ? c : document.createTextNode(c)); }
      return el;
    }
    const svg = (inner) => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + inner + '</svg>';
    const ICON = {
      copy: svg('<rect x="9" y="9" width="12" height="12" rx="3"/><path d="M5 15V6a3 3 0 0 1 3-3h9"/>'),
      check: svg('<polyline points="4 12.5 9.5 18 20 6.5"/>'),
      share: svg('<path d="M12 15V3"/><path d="m7.5 7.5 4.5-4.5 4.5 4.5"/><path d="M5 12v6a3 3 0 0 0 3 3h8a3 3 0 0 0 3-3v-6"/>'),
      organizer: svg('<rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/>'),
    };
    const announce = (msg) => { $("status").textContent = msg; };

    async function api(path, body) {
      const opts = body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) };
      let res;
      try { res = await fetch("/api" + path, opts); } catch { throw new Error("Could not reach the server."); }
      let data = {};
      try { data = await res.json(); } catch {}
      if (!res.ok) { const err = new Error(data.error || "Something went wrong."); err.status = res.status; throw err; }
      return data;
    }
    function linkTo(extra) {

    /* The trips this browser has made or joined, so a closed tab never loses the way back.

    /* ---------------- halftone title (adapted from the ARC landing page) ---------------- */
    (() => {
      const canvas = $("title");
      const ctx = canvas.getContext("2d");
      const WORD = "Travelbee";
      const RGB = "214, 112, 0";   // deep honey, strong contrast on white
      const FONT = '900 100px "Hanken Grotesk", system-ui, sans-serif';
      const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
      const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
      let CELL = 8, cols = 0, rows = 0, cw = 0, chh = 0, ox = 0, oy = 0;
      let field = new Float32Array(0);
      let raf = 0, start = 0, visible = true;
      let tx = -9999, ty = -9999, sx = -9999, sy = -9999;

      async function build() {
        try { await document.fonts.load(FONT, WORD); } catch {}
        const rect = canvas.getBoundingClientRect();
        cw = rect.width; chh = rect.height;
        if (!cw || !chh) return;
        CELL = clamp(cw / 80, 4, 8);
        cols = Math.floor(cw / CELL); rows = Math.floor(chh / CELL);
        ox = (cw - cols * CELL) / 2; oy = (chh - rows * CELL) / 2;
        const dpr = Math.min(devicePixelRatio, 2);
        canvas.width = cw * dpr; canvas.height = chh * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        const off = document.createElement("canvas");
        off.width = cols; off.height = rows;
        const o = off.getContext("2d", { willReadFrequently: true });
        let size = (rows * 0.74) / 0.7;
        o.font = FONT.replace("100px", size + "px");
        const w = o.measureText(WORD).width;
        if (w > cols * 0.98) { size *= (cols * 0.98) / w; o.font = FONT.replace("100px", size + "px"); }
        o.textAlign = "center"; o.fillStyle = "#000";
        o.fillText(WORD, cols / 2, rows / 2 + (size * 0.7) / 2);
        const px = o.getImageData(0, 0, cols, rows).data;

        const core = new Float32Array(cols * rows);
        for (let i = 0; i < core.length; i++) core[i] = px[i * 4 + 3] / 255;
        const blur = (src) => {
          const dst = new Float32Array(src.length);
          for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
            let s = 0, n = 0;
            for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
              const rr = r + dr, cc = c + dc;
              if (rr >= 0 && rr < rows && cc >= 0 && cc < cols) { s += src[rr * cols + cc]; n++; }
            }
            dst[r * cols + c] = s / n;
          }
          return dst;
        };
        const halo = blur(blur(core));
        field = new Float32Array(core.length);
        for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
          const i = r * cols + c;
          const shade = 0.9 + 0.1 * (r / rows);
          field[i] = Math.max(core[i] * shade, halo[i] * 0.35);
        }
        start = performance.now();
        kick();
      }

      function draw(now) {
        ctx.clearRect(0, 0, cw, chh);
        sx += (tx - sx) * 0.16; sy += (ty - sy) * 0.16;
        let busy = false;
        const bx = ((now / 5000) % 1) * (cols + 30) - 15;
        for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
          const v = field[r * cols + c];
          if (v < 0.06) continue;
          let x = ox + (c + 0.5) * CELL, y = oy + (r + 0.5) * CELL;
          const p = still ? 1 : clamp((now - start - c * 9 - r * 5) / 560);
          if (p <= 0) { busy = true; continue; }
          if (p < 1) busy = true;
          const e = 1 - Math.pow(1 - p, 4);
          const dx = x - sx, dy = y - sy, d2 = dx * dx + dy * dy;
          const g = d2 < 160 * 160 ? Math.exp(-d2 / (90 * 90)) : 0;
          if (g > 0.01) { const d = Math.sqrt(d2) || 1; x += (dx / d) * g * 5; y += (dy / d) * g * 5; busy = true; }
          const amb = still ? 0 : 0.26 * Math.sin(now * 0.0022 + c * 0.26 - r * 0.18) + 0.14 * Math.sin(now * 0.0013 - c * 0.12 + r * 0.34) + 0.08 * Math.sin(now * 0.0035 + (c + r) * 0.5);
          const sheen = still ? 0 : 0.5 * Math.exp(-(((c - bx) / 6) ** 2));
          const fx = still ? 0 : Math.sin(now * 0.0014 + r * 0.4) * 1.7, fy = still ? 0 : Math.cos(now * 0.0017 + c * 0.3) * 1.7;
          const rad = Math.min(CELL * 0.74, v * CELL * 0.64 * (0.6 + 0.4 * e) * (1 + 0.5 * g + amb * 0.6 + sheen));

      }

      });
    })();

    /* ---------------- AI lights: one pulse of rim light (ported from design.how/vault/ai-lights) ---------------- */
    const AIL = (() => {
      const PULSE_MS = 1600, ARC_MIN = 90, ARC_MAX = 190, MASK_SETTLE_MS = 90;
      const RIM_STOPS = [
        { color: "#000", stop: 54 }, { color: "transparent", stop: 126 }, { color: "transparent", stop: 333 },
        { color: "rgba(0,0,0,0.10)", stop: 347 }, { color: "#000", stop: 360 },
      ];
      const RIM_LAYERS = [
        { strokeWidth: 0, blur: 0, alpha: 1, ring: 1 }, { strokeWidth: 4, blur: 4, alpha: 0.3 }, { strokeWidth: 8, blur: 8, alpha: 0.2 },
        { strokeWidth: 16, blur: 12, alpha: 0.1 }, { strokeWidth: 20, blur: 20, alpha: 0.32 },
      ];
      const cache = new Map();
      let scratch = null;
      const padOf = (sw, blur) => Math.ceil(sw + blur * 3);

      // The mask: the body's rounded rect stroked with a conic of opacity, blurred, exported once per geometry.
      function buildMask(o) {
        const key = [Math.round(o.width), Math.round(o.height), Math.round(o.radius), o.strokeWidth, o.blur, o.alpha, o.ring || 0].join("|");
        if (cache.has(key)) return cache.get(key);
        const pad = padOf(o.strokeWidth, o.blur);
        const w = Math.max(1, Math.ceil(o.width) + pad * 2), hh = Math.max(1, Math.ceil(o.height) + pad * 2);
        scratch = scratch || document.createElement("canvas");
        scratch.width = w; scratch.height = hh;
        const ctx = scratch.getContext("2d");
        if (!ctx || !ctx.roundRect || !ctx.createConicGradient) return "";
        ctx.clearRect(0, 0, w, hh);
        if (o.blur) ctx.filter = "blur(" + ("GestureEvent" in window ? o.blur * 0.25 : o.blur) + "px)";
        const g = ctx.createConicGradient(0, w / 2, hh / 2);

        ctx.strokeStyle = g; ctx.fillStyle = g; ctx.globalAlpha = o.alpha;
        const x = (w - o.width) / 2, y = (hh - o.height) / 2;
        const r = Math.max(0, Math.min(o.radius, o.width / 2, o.height / 2));
        ctx.beginPath(); ctx.roundRect(x, y, o.width, o.height, r);
        if (o.strokeWidth) { ctx.lineWidth = o.strokeWidth; ctx.stroke(); }
        else {
          ctx.fill();
          if (o.ring) {
            ctx.globalCompositeOperation = "destination-out"; ctx.globalAlpha = 1; ctx.filter = "none";
            const r2 = Math.max(0, Math.min(r - o.ring, (o.width - o.ring * 2) / 2, (o.height - o.ring * 2) / 2));
            ctx.beginPath(); ctx.roundRect(x + o.ring, y + o.ring, Math.max(0, o.width - o.ring * 2), Math.max(0, o.height - o.ring * 2), r2); ctx.fill();
            ctx.globalCompositeOperation = "source-over";
          }
        }
        const url = scratch.toDataURL("image/png");
        if (cache.size >= 24) cache.delete(cache.keys().next().value);
        cache.set(key, url);
        return url;
      }

      // Each pulse rolls a new palette: one anchor hue walking an arc of the colour wheel.
      const hsl = (hue, s, l, a = 1) => { const hh = ((hue % 360) + 360) % 360; return a === 1 ? "hsl(" + hh.toFixed(1) + " " + s + "% " + l + "%)" : "hsl(" + hh.toFixed(1) + " " + s + "% " + l + "% / " + a + ")"; };
      function writePalette(el, anchor, arc) {
        const at = (t) => anchor + arc * t, st = el.style;
        st.setProperty("--ai-c1", hsl(at(0), 96, 48)); st.setProperty("--ai-c2", hsl(at(0.18), 52, 80));
        st.setProperty("--ai-c3", hsl(at(0.4), 98, 55)); st.setProperty("--ai-c4", hsl(at(0.66), 96, 52));
        st.setProperty("--ai-c5", hsl(at(0.88), 94, 50)); st.setProperty("--ai-c6", hsl(at(1), 90, 72, 0.8));
        st.setProperty("--ai-tail", hsl(at(-0.12), 70, 76, 0.63));
      }

      function attach(el) {
        const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
        let timer = 0, settle = 0;
        function build() {
          const box = el.getBoundingClientRect();
          if (!box.width || !box.height) return;
          el.querySelectorAll(":scope > .ail-layer").forEach((n) => n.remove());
          for (const l of RIM_LAYERS) {
            const mask = buildMask({ width: box.width, height: box.height, radius: box.height / 2, strokeWidth: l.strokeWidth, blur: l.blur, alpha: l.alpha, ring: l.ring });
            if (!mask) continue;
            const pad = padOf(l.strokeWidth, l.blur);
            for (const side of [0, 1]) {   // drawn twice, the second mirrored, because the lit arc sits on one side
              const span = document.createElement("span");
              span.className = "ail-layer";
              span.style.inset = -pad + "px";
              span.style.maskImage = span.style.webkitMaskImage = "url(" + mask + ")";
              if (side) span.style.transform = "scaleX(-1)";
              el.append(span);
            }
          }
        }
        build();
        new ResizeObserver(() => { clearTimeout(settle); settle = setTimeout(build, MASK_SETTLE_MS); }).observe(el);
        return {
          play() {
            if (still) return;
            clearTimeout(timer);
            writePalette(el, Math.random() * 360, (ARC_MIN + Math.random() * (ARC_MAX - ARC_MIN)) * (Math.random() < 0.5 ? -1 : 1));
            el.dataset.playing = "false"; void el.offsetWidth; el.dataset.playing = "true";
            timer = setTimeout(() => el.removeAttribute("data-playing"), PULSE_MS + 200);
          },
        };
      }
      return { attach };
    })();

    /* ---------------- landing: one button, straight into setup ---------------- */
    function setupCreate() {

        return true;

            fieldset("Activities you want", "activities", "checkbox"), fieldset("Where you stay", "lodging", "radio"), fieldset("Dealbreakers", "dealbreakers", "checkbox"),
            formErr),
          h("div", { class: "shell-foot" }, h("span", { class: "meta", text: ADMIN ? "You are the organizer" : "Trip " + TRIP }), sendBtn)));
      app.append(form);

      nameIn.addEventListener("input", () => { nameErr.hidden = true; nameIn.removeAttribute("aria-invalid"); });
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const name = nameIn.value.trim();
        if (!name) { nameErr.hidden = false; nameIn.setAttribute("aria-invalid", "true"); nameIn.focus(); return; }
        const one = (n) => (form.querySelector('input[name="' + n + '"]:checked') || {}).value || null;
        const many = (n) => [...form.querySelectorAll('input[name="' + n + '"]:checked')].map((x) => x.value);
        const b = parseFloat(budget.value);
        const body = {
          name, home_city: city.value.trim(), budget_per_night: Number.isFinite(b) ? b : null,
          answers: { pace: one("pace"), budget: one("budget"), food: one("food"), activities: many("activities"), lodging: one("lodging"), dealbreakers: many("dealbreakers") },
        };
        if (ADMIN) body.admin = ADMIN;
        sendBtn.disabled = true; formErr.hidden = true;
        try {
          const r = await api("/trips/" + TRIP + "/users", body);
          if (!ADMIN) remember({ id: TRIP, role: "traveler", secret: r.user_id });
          showThanks(name, r.user_id);
        } catch (err) {
          formErr.textContent = err.message; formErr.hidden = false; sendBtn.disabled = false;
        }
      });
    }

    function showThanks(name, userId) {
      enterAppView();
      const mine = linkTo({ trip: TRIP, u: userId });
      const back = ADMIN ? linkTo({ trip: TRIP, admin: ADMIN }) : mine;
      app.append(card([
        h("h2", { class: "title", text: "Thanks, " + name }),
        h("p", { class: "desc", text: ADMIN ? "You are now part of the group." : "Your answers are in. This device will remember your page." }),
      ], h("div", { class: "shell-foot" }, h("a", { class: "glass glass-sm", href: back }, h("span", { text: ADMIN ? "Back to your trip" : "Open my page" })))));
      announce("Answers sent");
    }

    /* ---------------- polling helper ---------------- */
    function poll(fn) {
      let stop = false;
      const loop = async () => {
        if (stop) return;
        try { await fn(); } catch (e) { announce(e.message); }
        setTimeout(loop, 2000);
      };
      loop();
      return () => { stop = true; };
    }

    /* ---------------- organizer: one step at a time ---------------- */
    async function showDashboard() {
      enterAppView();
      const qs = "?admin=" + encodeURIComponent(ADMIN);
      let first;
      try { first = await api("/trips/" + TRIP + "/dashboard" + qs); }
      catch (e) { return showError(e.message); }
      remember({ id: TRIP, role: "organizer", secret: ADMIN });

      const state = { logLen: 0, pendingKey: "", topKey: null, sig: "" };
      let editing = false, latest = first;

      /* 1. where and when */
      const top = h("div");

      /* 2. invite and plan, built once so button labels survive the polling */
      const members = h("ul", { class: "rows" });
      const inviteBtn = h("button", { class: "glass", type: "button" }, h("span", { text: "Copy invite link" }));
      const meta = h("span", { class: "meta" });
      const planBtn = h("button", { class: "glass glass-sm", type: "button" }, h("span", { text: "Plan our trip" }));
      const msg = h("span", { class: "error", role: "alert", hidden: true });
      const invite = h("div", { hidden: true }, h("div", { class: "shell" },
        h("div", { class: "panel" },
          h("h2", { class: "heading", text: "Invite your group" }),
          h("div", { style: "margin-bottom:20px" }, inviteBtn),
          members, msg),
        h("div", { class: "shell-foot" }, meta, planBtn)));

      /* 3. while and after the agents work */
      const action = h("div", { hidden: true });
      const planBox = h("div", { hidden: true });
      const logBox = h("div", { class: "log", role: "log", "aria-label": "Agent messages" });
      const logCard = h("div", { hidden: true }, card([h("h2", { class: "heading", text: "What the agents said" }), logBox]));
      app.append(top, invite, action, planBox, logCard);

      inviteBtn.addEventListener("click", async () => {
        await copyText(linkTo({ trip: TRIP }));
        inviteBtn.querySelector("span").textContent = "Link copied";
        announce("Invite link copied. Send it to your group.");
        setTimeout(() => { inviteBtn.querySelector("span").textContent = "Copy invite link"; }, 1800);
      });
      const startPlan = async () => {
        planBtn.disabled = true; msg.hidden = true;
        try { await api("/trips/" + TRIP + "/plan" + qs, {}); }
        catch (e) { msg.textContent = e.message; msg.hidden = false; }
        refresh();
      };
      planBtn.addEventListener("click", startPlan);
      const answer = async (payload) => {
        try { await api("/trips/" + TRIP + "/answer", { admin: ADMIN, ...payload }); } catch (e) { announce(e.message); state.pendingKey = ""; }
        refresh();
      };

      function renderTop(d) {
        top.textContent = "";
        const hasDest = !!d.trip.destination;
        if (hasDest && !editing) {
          const when = d.trip.start && d.trip.end ? fmtDay(d.trip.start) + " to " + fmtDay(d.trip.end) : "No dates yet";
          top.append(card([
            h("h2", { class: "title", text: d.trip.destination }),
            h("p", { class: "desc", style: "margin:0" }, when + " ", h("button", { class: "textlink", type: "button", text: "Edit", onclick: () => { editing = true; paint(latest); } })),
          ]));
          return;
        }
        const dest = h("input", { id: "dest", class: "input", type: "text", maxlength: "80", placeholder: "Miami, Lisbon, Tokyo", value: d.trip.destination, "aria-label": "Destination" });
        const from = h("input", { id: "d-from", class: "input", type: "date", value: d.trip.start });
        const to = h("input", { id: "d-to", class: "input", type: "date", value: d.trip.end });
        const err = h("span", { class: "error", role: "alert", hidden: true });
        const go = h("button", { class: "glass glass-sm", type: "submit" }, h("span", { text: hasDest ? "Save" : "Continue" }));
        const form = h("form", { novalidate: true }, h("div", { class: "shell" },
          h("div", { class: "panel" },
            h("h2", { class: "title", text: "Where are you going?" }),
            h("div", { class: "field", style: "margin-top:16px" }, dest),
            h("div", { class: "field row2" },
              h("div", {}, h("label", { for: "d-from", text: "From (optional)" }), from),
              h("div", {}, h("label", { for: "d-to", text: "To (optional)" }), to)),
            err),
          h("div", { class: "shell-foot" }, hasDest ? h("button", { class: "flat", type: "button", text: "Cancel", onclick: () => { editing = false; paint(latest); } }) : null, go)));
        form.addEventListener("submit", async (e) => {
          e.preventDefault();
          if (!dest.value.trim()) { err.textContent = "Add a destination."; err.hidden = false; dest.focus(); return; }
          go.disabled = true; err.hidden = true;
          try { await api("/trips/" + TRIP + "/details" + qs, { destination: dest.value, start: from.value, end: to.value }); editing = false; await refresh(); }
          catch (ex) { err.textContent = ex.message; err.hidden = false; go.disabled = false; }
        });
        top.append(form);
        if (!hasDest) setTimeout(() => dest.focus(), 0);
      }

      function paint(d) {
        latest = d;
        const status = d.trip.status;
        const gathering = status === "gathering";
        const topKey = [editing, d.trip.destination, d.trip.start, d.trip.end].join("|");
        if (topKey !== state.topKey) { state.topKey = topKey; renderTop(d); }

        invite.hidden = !(d.trip.destination && !editing && gathering);
        const hasOrg = d.members.some((m) => m.is_organizer);
        const sig = JSON.stringify([hasOrg, d.members.map((m) => [m.id, m.name, m.home_city, m.budget_per_night, m.answers])]);
        if (sig !== state.sig) {
          state.sig = sig;
          members.textContent = "";
          if (!hasOrg) members.append(h("li", {}, h("span", { class: "who", text: "You" }), h("span", { class: "sub" }, h("a", { class: "link-strong", href: linkTo({ trip: TRIP, admin: ADMIN, answer: 1 }), text: "Add your answers" }))));
          for (const m of d.members) {
            members.append(h("li", {}, h("details", { class: "member" },
              h("summary", {},
                h("span", { class: "who", text: m.name }), m.is_organizer ? h("span", { class: "badge", text: "You" }) : null,
                h("span", { class: "sub", text: [m.home_city, m.budget_per_night != null ? money(m.budget_per_night) + " per night" : ""].filter(Boolean).join(", ") })),
              h("p", { class: "detail", text: answersLine(m.answers || {}) }))));
          }
        }
        const n = d.members.length;
        planBtn.disabled = n < 2;
        meta.textContent = n + " joined" + (n < 2 ? ". Plan once two have answered." : "");

        logCard.hidden = !d.log.length;
        renderLog(logBox, d.log, state);
        renderAction(action, d.pending, state, answer);
        planBox.hidden = !(status === "done" && d.plan);
        if (!planBox.hidden) {
          planBox.textContent = "";
          planBox.append(card([h("h2", { class: "heading", text: "Final plan" }), renderPlan(d.plan),
            h("button", { class: "textlink", type: "button", text: "Plan again", onclick: startPlan })]));
        }
      }
      async function refresh() { paint(await api("/trips/" + TRIP + "/dashboard" + qs)); }
      paint(first);
      poll(refresh);
    }

    /* ---------------- personal page ---------------- */
    async function showPersonal() {
      enterAppView();
      let first;
      try { first = await api("/trips/" + TRIP + "/me?u=" + encodeURIComponent(UID)); }
      catch (e) { return showError(e.message); }

      const tripP = h("p", { class: "desc" });
      const statusP = h("p", { class: "note" });
      const action = h("div", { hidden: true });
      const planBox = h("div", { hidden: true });
      const logBox = h("div", { class: "log", role: "log", "aria-label": "Agent messages" });
      const logCard = h("div", { hidden: true }, card([h("h2", { class: "heading", text: "What the agents said" }), logBox]));
      remember({ id: TRIP, role: "traveler", secret: UID });
      const copyMine = h("button", { class: "textlink", type: "button", text: "Copy my link", onclick: async () => {
        await copyText(location.href); copyMine.textContent = "Copied"; announce("Link copied");
        setTimeout(() => { copyMine.textContent = "Copy my link"; }, 1600);
      } });
      app.append(card([h("h2", { class: "title", text: "Hi, " + first.user.name }), tripP, statusP],
        h("div", { class: "shell-foot" }, h("span", { class: "meta", text: "Trip " + TRIP }),
          copyMine, h("a", { class: "textlink", href: linkTo({ trip: TRIP, new: 1 }), text: "Not you?" }))),
        action, planBox, logCard);

      const state = { logLen: 0, pendingKey: "" };
      const answer = async (payload) => {
        try { await api("/trips/" + TRIP + "/answer", { u: UID, ...payload }); } catch (e) { announce(e.message); state.pendingKey = ""; }
        refresh();
      };
      const STATUS = {
        gathering: "Your answers are saved. The organizer will start planning once everyone has joined.",
        planning: "Your agent is negotiating with the others now.",
        awaiting: "The agents are waiting on a human answer.",
        done: "The plan is final.",
      };
      function paint(d) {
        tripP.textContent = tripLine(d.trip);
        statusP.textContent = STATUS[d.trip.status] || "";
        logCard.hidden = !d.log.length;
        renderLog(logBox, d.log, state);
        renderAction(action, d.pending, state, answer);
        planBox.hidden = !(d.trip.status === "done" && d.plan);
        if (!planBox.hidden) { planBox.textContent = ""; planBox.append(card([h("h2", { class: "heading", text: "Final plan" }), renderPlan(d.plan)])); }
      }
      async function refresh() { paint(await api("/trips/" + TRIP + "/me?u=" + encodeURIComponent(UID))); }
      paint(first);
      poll(refresh);
    }

    /* ---------------- routing by link ---------------- */
    if (TRIP && ADMIN && !ANSWER_MODE) showDashboard();
    else if (TRIP && UID && !ADMIN) showPersonal();
    else if (TRIP) showForm();
    else setupCreate();
  </script>
</body>
</html>
